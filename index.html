<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentPay - Solana Tabanlı Web3 Ödeme Altyapısı</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --primary: #9333ea; --primary-hover: #7e22ce; --text: #f8fafc; --muted: #94a3b8; --accent: #22c55e; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; border-bottom: 1px solid #334155; }
        .logo { font-size: 24px; font-weight: bold; color: #c084fc; }
        .hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 60px 20px; flex: 1; }
        h1 { font-size: 42px; margin-bottom: 10px; background: linear-gradient(to right, #c084fc, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: var(--muted); font-size: 18px; max-width: 600px; margin-bottom: 40px; }
        .checkout-card { background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: left; border: 1px solid #334155; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 16px; }
        button { background: var(--primary); color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        .btn-success { background: var(--accent); }
        .btn-success:hover { background: #16a34a; }
        #status { margin-top: 15px; font-size: 14px; color: #38bdf8; text-align: center; word-break: break-all; }
        footer { text-align: center; padding: 20px; color: var(--muted); border-top: 1px solid #334155; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ AgentPay</div>
        <div><a href="https://github.com" target="_blank" style="color: var(--muted); text-decoration: none;">GitHub Dokümantasyon</a></div>
    </header>

    <div class="hero">
        <h1>Yapay Zeka ve Web3 İçin Anında Ödeme</h1>
        <p class="subtitle">Solana ağının hızı ve sıfıra yakın komisyon oranlarıyla USDC tabanlı güvenli ödeme altyapısını projelerinize entegre edin.</p>

        <div class="checkout-card">
            <h3>Hızlı Test & Ödeme Paneli</h3>
            <div class="form-group">
                <label>Ödenecek Tutar (USDC)</label>
                <input type="number" id="amount" value="1">
            </div>
            
            <button id="connectBtn" onclick="connectWallet()">Phantom Cüzdanı Bağla</button>
            <button id="payBtn" class="btn-success" onclick="sendUSDC()" style="display:none;">USDC ile Ödeme Yap</button>
            
            <div id="status"></div>
        </div>
    </div>

    <footer>
        &copy; 2026 AgentPay MVP. Tüm hakları saklıdır. Solana Mainnet/Devnet Destekli.
    </footer>

    <script>
        let userWallet = null;

        async function connectWallet() {
            const provider = window.phantom?.solana;
            if (provider?.isPhantom) {
                try {
                    const response = await provider.connect();
                    userWallet = response.publicKey;
                    document.getElementById("status").innerText = "Bağlandı: " + userWallet.toString().slice(0, 4) + "..." + userWallet.toString().slice(-4);
                    document.getElementById("connectBtn").style.display = "none";
                    document.getElementById("payBtn").style.display = "block";
                } catch (err) {
                    console.error(err);
                    document.getElementById("status").innerText = "Cüzdan bağlantısı reddedildi.";
                }
            } else {
                alert("Phantom cüzdanı bulunamadı!");
                window.open("https://phantom.app/", "_blank");
            }
        }

        async function sendUSDC() {
            const amount = document.getElementById("amount").value;
            if (!userWallet) {
                alert("Önce cüzdanınızı bağlayın!");
                return;
            }

            document.getElementById("status").innerText = "İşlem hazırlanıyor...";

            try {
                const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('devnet'), 'confirmed');
                const recipientPubKey = new solanaWeb3.PublicKey("F66HsNWKPLvEek2V8BSa8bpsLjaxruARMMnaBamYePah");

                const transaction = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: userWallet,
                        toPubkey: recipientPubKey,
                        lamports: amount * solanaWeb3.LAMPORTS_PER_SOL
                    })
                );

                const { blockhash } = await connection.getLatestBlockhash();
                transaction.recentBlockhash = blockhash;
                transaction.feePayer = userWallet;

                const signed = await window.phantom.solana.signTransaction(transaction);
                const signature = await connection.sendRawTransaction(signed.serialize());
                
                document.getElementById("status").innerText = "İşlem Gönderildi! Hash: " + signature.slice(0, 10) + "...";
                
                await fetch("https://agentpay-mvp-production-57ee.up.railway.app/api/pay-usdc", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        sender_wallet: userWallet.toString(),
                        amount: parseFloat(amount),
                        tx_signature: signature
                    })
                });

                alert("Ödeme başarıyla tamamlandı!");

            } catch (error) {
                console.error(error);
                document.getElementById("status").innerText = "Hata: " + (error.message || error);
            }
        }
    </script>
</body>
</html>
